name: Build APK

# First run: unpacks the Recipe Book project into this repository and saves it.
# Every run: builds the app and offers the APK for download on the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unpack the project (first run only)
        if: hashFiles('settings.gradle.kts') == ''
